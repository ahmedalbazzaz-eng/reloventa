<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>Reloventa icon — Orbit</title><desc>A reloading ring with an orbiting node and a warm core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2A2A"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
    <radialGradient id="glow" cx=".18" cy=".92" r=".75"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1="200" y1="830" x2="840" y2="200" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EDEDED"/><stop offset="1" stop-color="#BFBFBF"/></linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFCFCF"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.06"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
  </defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
  </filter>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="412" fill="url(#gloss)"/>
  </g>
  <path d="M726.2 530.7 A215 215 0 1 1 493.3 297.8" fill="none" stroke="url(#ring)" stroke-width="80" stroke-linecap="round"/>
  <path d="M412.4 503.3 A100 100 0 1 1 537.9 608.6" fill="none" stroke="url(#core)" stroke-width="58" stroke-linecap="round"/>
  <circle cx="664.0" cy="360.0" r="92" fill="url(#halo)"/>
  <circle cx="664.0" cy="360.0" r="44" fill="#FFFFFF"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="186.5" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="3"/>
</svg>
