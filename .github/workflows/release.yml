name: Release
# Publishes a macOS release automatically whenever `version` in package.json changes on main.
# One-time setup (Settings > Secrets and variables > Actions > Variables): set MAC_RUNNER to
#   "macos-14"                        (GitHub-hosted runner, if your account can use it), or
#   ["self-hosted","macOS","ARM64"]   (a runner installed on your Mac - see docs/RELEASING.md)
# Until MAC_RUNNER is set, this workflow stays idle.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  mac:
    if: ${{ vars.MAC_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.MAC_RUNNER) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Skip if this version is already released
        id: ver
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "push" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - if: steps.ver.outputs.skip == 'false'
        run: npm install
      - if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          # Empty secrets arrive as empty variables; electron-builder would treat an empty CSC_LINK as a path. Unset them.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -z "${!v}" ] && unset "$v"; done
          npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing / notarization (needed for seamless macOS auto-update on other Macs):
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Free disk space (builds live on GitHub, not on your Mac)
        if: always()
        run: rm -rf dist node_modules ~/Library/Caches/electron ~/Library/Caches/electron-builder
