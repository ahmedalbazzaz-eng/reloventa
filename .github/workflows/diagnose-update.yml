name: Diagnose app update
# Read-only: inspects where Reloventa is installed and the updater state on the self-hosted Mac. Usernames are redacted (public logs).
on: workflow_dispatch
jobs:
  mac:
    if: ${{ vars.MAC_RUNNER != '' }}
    runs-on: ${{ fromJSON(vars.MAC_RUNNER) }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          red() { sed -E "s|/Users/[^/ ]+/|/Users/<user>/|g"; }
          echo "local time: $(date)  tz: $(date +%Z)"
          echo "== copies of the app (bundle id app.reloventa.mac)"
          mdfind "kMDItemCFBundleIdentifier == 'app.reloventa.mac'" | while read -r A; do
            echo "- $(echo "$A" | red)  version=$(defaults read "$A/Contents/Info" CFBundleShortVersionString 2>&1)  arch=$(lipo -archs "$A/Contents/MacOS/Reloventa" 2>&1)  sig=$(codesign -dv "$A" 2>&1 | grep -E '^Signature=' )  authority=$(codesign -dv "$A" 2>&1 | grep -c Authority)"
          done
          ls -d /Applications/Reloventa* ~/Applications/Reloventa* /Volumes/Reloventa* 2>/dev/null | red
          echo "== running processes"; pgrep -fl "Reloventa" | head -3 | red | cut -c1-140
          echo "== update-info.json"; cat ~/Library/Caches/reloventa-updater/pending/update-info.json 2>&1 | red | cut -c1-300
          echo "== files"; ls -la ~/Library/Caches/reloventa-updater ~/Library/Caches/reloventa-updater/pending ~/Library/Caches/app.reloventa.mac.ShipIt 2>&1 | red
          echo "== ShipIt_stdout.log (tail)"; tail -12 ~/Library/Caches/app.reloventa.mac.ShipIt/ShipIt_stdout.log 2>&1 | red | cut -c1-220
          echo "== ShipIt_stderr.log timestamps"; grep -oE '^[0-9-]+ [0-9:]+' ~/Library/Caches/app.reloventa.mac.ShipIt/ShipIt_stderr.log 2>/dev/null | sort | sed -n '1p;$p'
          echo "== signature validation errors in stderr"; grep -iE "signature|requirement|validation|not valid" ~/Library/Caches/app.reloventa.mac.ShipIt/ShipIt_stderr.log 2>/dev/null | red | cut -c1-220 | tail -5
