<!doctype html>
<html lang="en" data-theme="system" data-motion="system">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reloventa</title>
<link rel="icon" href="assets/reloventa-icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app" id="app">
  <!-- Floating glass navigation -->
  <nav class="sidebar glass" id="sidebar" aria-label="Platforms">
    <div class="brand" aria-hidden="false">
      <img src="assets/reloventa-icon.svg" alt="" width="34" height="34" class="brand-mark">
      <div class="brand-text"><b>Reloventa</b><span>Social. Stream. Explore.</span></div>
    </div>
    <div class="nav-scroll" id="navList"></div>
    <div class="nav-foot">
      <button class="nav-item" id="btnSettings" data-tip="Settings ⌘,"><span class="tile plain"><svg class="g"><use href="#i-sliders"/></svg></span><span class="lbl">Settings</span></button>
      <button class="nav-item" id="btnCollapse" data-tip="Toggle sidebar ⌥⌘S" aria-label="Collapse sidebar"><span class="tile plain"><svg class="g"><use href="#i-sidebar"/></svg></span><span class="lbl">Collapse</span></button>
    </div>
  </nav>

  <main class="main">
    <header class="toolbar drag" id="toolbar">
      <div class="tb-group nodrag">
        <button class="icon-btn" id="tbBack" aria-label="Back" title="Back ⌘["><svg class="g"><use href="#i-back"/></svg></button>
        <button class="icon-btn" id="tbFwd" aria-label="Forward" title="Forward ⌘]"><svg class="g"><use href="#i-fwd"/></svg></button>
        <button class="icon-btn" id="tbReload" aria-label="Reload" title="Reload ⌘R"><svg class="g"><use href="#i-reload"/></svg></button>
      </div>
      <div class="title" id="tbTitle" aria-live="polite">Home</div>
      <div class="tb-group nodrag">
        <div class="seg" id="layoutSeg" role="radiogroup" aria-label="Layout">
          <button role="radio" data-layout="auto" title="Adaptive layout">Auto</button>
          <button role="radio" data-layout="phone" title="Phone column">Phone</button>
          <button role="radio" data-layout="wide" title="Widescreen">Wide</button>
        </div>
        <button class="icon-btn" id="tbFocus" aria-label="Focus mode" title="Focus mode ⇧⌘F"><svg class="g"><use href="#i-focus"/></svg></button>
        <button class="pill-btn" id="tbPalette" aria-label="Open command palette">Jump to… <kbd>⌘K</kbd></button>
      </div>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </header>

    <section class="stage" id="stage">
      <div class="slot-ambient" id="slotAmbient" aria-hidden="true"></div>
      <div class="slot" id="slot" aria-label="Content"></div>
      <div class="backdrop" id="backdrop" aria-hidden="true"></div>
      <div class="home" id="home" tabindex="-1"></div>
    </section>
  </main>
</div>

<!-- Command palette -->
<div class="overlay" id="paletteWrap" hidden>
  <div class="sheet palette glass" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="paletteInput" type="text" placeholder="Jump to a platform or run a command…" aria-label="Search commands" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="paletteList">
    <ul id="paletteList" role="listbox"></ul>
  </div>
</div>

<!-- Settings -->
<div class="overlay" id="settingsWrap" hidden>
  <div class="sheet settings glass" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <header><h2 id="setTitle">Settings</h2><button class="icon-btn" id="setClose" aria-label="Close settings"><svg class="g"><use href="#i-x"/></svg></button></header>
    <div class="set-body" id="setBody"></div>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-feed" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><rect x="4" y="5" width="16" height="3.6" rx="1.8"/><rect x="4" y="10.2" width="11" height="3.6" rx="1.8"/><rect x="4" y="15.4" width="14" height="3.6" rx="1.8"/></g></symbol>
    <symbol id="i-frame" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5" fill="none"/><circle cx="12" cy="12" r="3.6" fill="none"/><circle cx="16.7" cy="7.4" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-reel" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="4" fill="none"/><circle cx="12" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M10 15.5h4" fill="none"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4" fill="none"/><path d="M7 12c1.5-2 3-2 4.5 0s3 2 4.5 0" fill="none"/></symbol>
    <symbol id="i-spot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none"/><path d="M12 7.4l1.4 3 3.1.4-2.3 2.1.6 3.1-2.8-1.6-2.8 1.6.6-3.1-2.3-2.1 3.1-.4z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-crate" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="10" rx="3" fill="none"/><path d="M7 5.5h10M9 2.5h6" fill="none"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5v8a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z" fill="none"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16" fill="none"/><circle cx="9" cy="8" r="2.4" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="2.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="4" fill="none"/><path d="M9.5 5v14" fill="none"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6" fill="none"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6" fill="none"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4" fill="none"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" fill="none"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
